<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Sample handwriting worksheet with name tracing rows and sky grass ground guide lines">
  <rect width="1200" height="760" fill="#ffffff"/>
  <g font-family="'DM Sans', system-ui, sans-serif" fill="#334155">
    <text x="90" y="78" font-size="30" font-weight="600">Name:</text>
    <line x1="190" y1="86" x2="520" y2="86" stroke="#334155" stroke-width="2"/>
    <text x="880" y="78" font-size="30" font-weight="600" text-anchor="end">Date:</text>
    <line x1="905" y1="86" x2="1110" y2="86" stroke="#334155" stroke-width="2"/>
  </g>
  <g font-family="'Patrick Hand', 'Comic Sans MS', cursive">
    <!-- Row 1: model -->
    <g>
      <line x1="90" y1="150" x2="1110" y2="150" stroke="#8fb8e8" stroke-width="3"/>
      <line x1="90" y1="220" x2="1110" y2="220" stroke="#e08080" stroke-width="2.5" stroke-dasharray="16 12"/>
      <line x1="90" y1="284" x2="1110" y2="284" stroke="#4a7fc9" stroke-width="4"/>
      <text x="110" y="284" font-size="122" fill="#1d4ed8">Emma</text>
    </g>
    <!-- Row 2: dotted tracing -->
    <g>
      <line x1="90" y1="350" x2="1110" y2="350" stroke="#8fb8e8" stroke-width="3"/>
      <line x1="90" y1="420" x2="1110" y2="420" stroke="#e08080" stroke-width="2.5" stroke-dasharray="16 12"/>
      <line x1="90" y1="484" x2="1110" y2="484" stroke="#4a7fc9" stroke-width="4"/>
      <text x="110" y="484" font-size="122" fill="none" stroke="#9aa7b8" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0.5 11">Emma   Emma   Emma</text>
    </g>
    <!-- Row 3: blank practice -->
    <g>
      <line x1="90" y1="550" x2="1110" y2="550" stroke="#8fb8e8" stroke-width="3"/>
      <line x1="90" y1="620" x2="1110" y2="620" stroke="#e08080" stroke-width="2.5" stroke-dasharray="16 12"/>
      <line x1="90" y1="684" x2="1110" y2="684" stroke="#4a7fc9" stroke-width="4"/>
    </g>
  </g>
  <g font-family="'DM Sans', system-ui, sans-serif" fill="#94a3b8">
    <text x="90" y="130" font-size="20">Model</text>
    <text x="90" y="330" font-size="20">Trace</text>
    <text x="90" y="530" font-size="20">Practice</text>
  </g>
</svg>
