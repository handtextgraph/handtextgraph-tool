<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Cornell notes template</title>
  <desc id="desc">A Cornell notes page with a header strip, cue column, ruled notes area, and summary box</desc>
  <rect width="800" height="600" fill="#FFFDF7"/>
  <circle cx="690" cy="90" r="120" fill="#EAF8F5"/>
  <circle cx="110" cy="510" r="90" fill="#FFF0ED"/>
  <!-- paper sheet -->
  <g transform="rotate(-1 400 300)">
    <rect x="170" y="60" width="460" height="480" rx="10" fill="#FFFFFF" stroke="#D9D5CC" stroke-width="2"/>
    <!-- header strip -->
    <text x="205" y="102" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#385f8d">Topic:</text>
    <text x="480" y="102" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#385f8d">Date:</text>
    <line x1="195" y1="120" x2="605" y2="120" stroke="#385f8d" stroke-width="3"/>
    <!-- cue divider: ends at the summary boundary -->
    <line x1="330" y1="120" x2="330" y2="440" stroke="#385f8d" stroke-width="3"/>
    <!-- summary line -->
    <line x1="195" y1="440" x2="605" y2="440" stroke="#385f8d" stroke-width="3"/>
    <!-- zone labels -->
    <text x="205" y="152" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#385f8d">Cues</text>
    <text x="350" y="152" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#385f8d">Notes</text>
    <text x="205" y="472" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#385f8d">Summary</text>
    <!-- ruled lines in the notes area only -->
    <line x1="330" y1="176" x2="605" y2="176" stroke="#8fb3da" stroke-width="2"/>
    <line x1="330" y1="208" x2="605" y2="208" stroke="#8fb3da" stroke-width="2"/>
    <line x1="330" y1="240" x2="605" y2="240" stroke="#8fb3da" stroke-width="2"/>
    <line x1="330" y1="272" x2="605" y2="272" stroke="#8fb3da" stroke-width="2"/>
    <line x1="330" y1="304" x2="605" y2="304" stroke="#8fb3da" stroke-width="2"/>
    <line x1="330" y1="336" x2="605" y2="336" stroke="#8fb3da" stroke-width="2"/>
    <line x1="330" y1="368" x2="605" y2="368" stroke="#8fb3da" stroke-width="2"/>
    <line x1="330" y1="400" x2="605" y2="400" stroke="#8fb3da" stroke-width="2"/>
    <!-- handwritten cues -->
    <g font-family="Georgia, serif" font-style="italic" fill="#17324D">
      <text x="205" y="196" font-size="20">Why does it</text>
      <text x="205" y="220" font-size="20">repeat?</text>
      <text x="205" y="268" font-size="20">Where does</text>
      <text x="205" y="292" font-size="20">the rain go?</text>
    </g>
    <!-- handwritten notes -->
    <g font-family="Georgia, serif" font-style="italic" fill="#17324D">
      <text x="350" y="172" font-size="22">Water evaporates,</text>
      <text x="350" y="204" font-size="22" fill="#218C82">warmed by the sun.</text>
      <text x="350" y="236" font-size="22">Vapour cools and</text>
      <text x="350" y="268" font-size="22">condenses into clouds.</text>
    </g>
    <!-- handwritten summary -->
    <g font-family="Georgia, serif" font-style="italic" fill="#17324D">
      <text x="205" y="500" font-size="20">The sun drives the cycle:</text>
      <text x="205" y="524" font-size="20">evaporate, condense, fall, return.</text>
    </g>
  </g>
  <!-- coral pencil -->
  <g transform="rotate(35 640 420)">
    <rect x="628" y="330" width="24" height="150" rx="10" fill="#F26B5B"/>
    <path d="M628 480 L640 520 L652 480 Z" fill="#17324D"/>
    <rect x="628" y="330" width="24" height="26" rx="10" fill="#F4C95D"/>
  </g>
</svg>
