<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Handwriting to text</title>
  <desc id="desc">A handwritten page beside its typed-text version, with an arrow showing the conversion</desc>
  <rect width="800" height="600" fill="#FFFDF7"/>
  <circle cx="690" cy="90" r="120" fill="#EAF8F5"/>
  <circle cx="110" cy="510" r="90" fill="#FFF0ED"/>
  <!-- handwritten page, left -->
  <g transform="rotate(-2 240 300)">
    <rect x="80" y="90" width="300" height="420" rx="10" fill="#FFFFFF" stroke="#D9D5CC" stroke-width="2"/>
    <g font-family="Georgia, serif" font-size="26" font-style="italic" fill="#17324D">
      <text x="110" y="160">Dear Ayesha,</text>
      <text x="110" y="215">Thank you for</text>
      <text x="110" y="270">your kind letter.</text>
      <text x="110" y="325">The garden is</text>
      <text x="110" y="380">in full bloom,</text>
      <text x="110" y="435">and the roses</text>
      <text x="110" y="470">smell lovely.</text>
    </g>
    <path d="M110 495 q40 -8 80 0 t80 0" stroke="#F26B5B" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- arrow between the pages -->
  <g>
    <line x1="400" y1="300" x2="470" y2="300" stroke="#2A9D8F" stroke-width="6" stroke-linecap="round"/>
    <path d="M470 300 L448 282 L448 318 Z" fill="#2A9D8F"/>
  </g>
  <!-- typed page, right -->
  <g transform="rotate(2 580 300)">
    <rect x="480" y="90" width="300" height="420" rx="10" fill="#FFFFFF" stroke="#D9D5CC" stroke-width="2"/>
    <g font-family="Georgia, serif" font-size="22" fill="#17324D">
      <text x="510" y="160">Dear Ayesha,</text>
      <text x="510" y="205">Thank you for</text>
      <text x="510" y="250">your kind letter.</text>
      <text x="510" y="295">The garden is</text>
      <text x="510" y="340">in full bloom,</text>
      <text x="510" y="385">and the roses</text>
      <text x="510" y="430">smell lovely.</text>
    </g>
    <line x1="510" y1="470" x2="740" y2="470" stroke="#2A9D8F" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- coral pencil -->
  <g transform="rotate(35 640 420)">
    <rect x="628" y="330" width="24" height="150" rx="10" fill="#F26B5B"/>
    <path d="M628 480 L640 520 L652 480 Z" fill="#17324D"/>
    <rect x="628" y="330" width="24" height="26" rx="10" fill="#F4C95D"/>
  </g>
</svg>
