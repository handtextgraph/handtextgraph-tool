<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Word search maker</title>
  <desc id="desc">A word search grid with the words APPLE and MANGO circled</desc>
  <rect width="800" height="600" fill="#FFFDF7"/>
  <circle cx="690" cy="90" r="120" fill="#EAF8F5"/>
  <circle cx="110" cy="510" r="90" fill="#FFF0ED"/>
  <!-- paper sheet -->
  <g transform="rotate(-1 400 300)">
    <rect x="170" y="70" width="460" height="460" rx="10" fill="#FFFFFF" stroke="#D9D5CC" stroke-width="2"/>
    <!-- puzzle title -->
    <text x="400" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#17324D">Fruit Word Search</text>
    <!-- word search grid: 9 columns x 7 rows, APPLE across row 2, MANGO down column 7 -->
    <g font-family="ui-monospace, monospace" font-size="30" fill="#17324D">
      <text x="231" y="185" letter-spacing="22">KRTBWQMSD</text>
      <text x="231" y="225" letter-spacing="22">APPLEZANF</text>
      <text x="231" y="265" letter-spacing="22">GJCHVRNTY</text>
      <text x="231" y="305" letter-spacing="22">DWLSUBGPO</text>
      <text x="231" y="345" letter-spacing="22">PXEKMTORA</text>
      <text x="231" y="385" letter-spacing="22">SNVFIHLCE</text>
      <text x="231" y="425" letter-spacing="22">UYOPARWQZ</text>
    </g>
    <!-- coral circle around APPLE (row 2, first five letters) -->
    <ellipse cx="320" cy="216" rx="105" ry="27" fill="none" stroke="#F26B5B" stroke-width="5" stroke-linecap="round"/>
    <!-- teal circle around MANGO (column 7, rows 1-5) -->
    <ellipse cx="480" cy="256" rx="27" ry="100" fill="none" stroke="#218C82" stroke-width="5" stroke-linecap="round"/>
    <!-- word list -->
    <text x="400" y="478" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#334155">APPLE  •  MANGO  •  PEAR  •  KIWI</text>
  </g>
  <!-- coral pencil -->
  <g transform="rotate(35 640 420)">
    <rect x="628" y="330" width="24" height="150" rx="10" fill="#F26B5B"/>
    <path d="M628 480 L640 520 L652 480 Z" fill="#17324D"/>
    <rect x="628" y="330" width="24" height="26" rx="10" fill="#F4C95D"/>
  </g>
</svg>
