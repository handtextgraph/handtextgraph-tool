<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Semi-log graph paper</title>
  <desc id="desc">A sheet of semi-log graph paper with log-spaced vertical lines, even horizontal lines, and a straight plotted line showing doubling growth</desc>
  <rect width="800" height="600" fill="#FFFDF7"/>
  <circle cx="690" cy="90" r="120" fill="#EAF8F5"/>
  <circle cx="110" cy="510" r="90" fill="#FFF0ED"/>
  <!-- paper sheet -->
  <g transform="rotate(-1 400 300)">
    <rect x="170" y="60" width="460" height="480" rx="10" fill="#FFFFFF" stroke="#D9D5CC" stroke-width="2"/>
    <!-- evenly spaced horizontal lines -->
    <g stroke="#8fb3da" stroke-width="1.5">
      <line x1="195" y1="100" x2="605" y2="100"/>
      <line x1="195" y1="125" x2="605" y2="125"/>
      <line x1="195" y1="150" x2="605" y2="150"/>
      <line x1="195" y1="175" x2="605" y2="175"/>
      <line x1="195" y1="200" x2="605" y2="200"/>
      <line x1="195" y1="225" x2="605" y2="225"/>
      <line x1="195" y1="250" x2="605" y2="250"/>
      <line x1="195" y1="275" x2="605" y2="275"/>
      <line x1="195" y1="300" x2="605" y2="300"/>
      <line x1="195" y1="325" x2="605" y2="325"/>
      <line x1="195" y1="350" x2="605" y2="350"/>
      <line x1="195" y1="375" x2="605" y2="375"/>
      <line x1="195" y1="400" x2="605" y2="400"/>
      <line x1="195" y1="425" x2="605" y2="425"/>
      <line x1="195" y1="450" x2="605" y2="450"/>
      <line x1="195" y1="475" x2="605" y2="475"/>
      <line x1="195" y1="500" x2="605" y2="500"/>
    </g>
    <!-- log-spaced vertical minor lines: decades 195-330, 330-465, 465-600 -->
    <g stroke="#8fb3da" stroke-width="1.5">
      <line x1="236" y1="85" x2="236" y2="515"/>
      <line x1="259" y1="85" x2="259" y2="515"/>
      <line x1="276" y1="85" x2="276" y2="515"/>
      <line x1="289" y1="85" x2="289" y2="515"/>
      <line x1="300" y1="85" x2="300" y2="515"/>
      <line x1="309" y1="85" x2="309" y2="515"/>
      <line x1="317" y1="85" x2="317" y2="515"/>
      <line x1="324" y1="85" x2="324" y2="515"/>
      <line x1="371" y1="85" x2="371" y2="515"/>
      <line x1="394" y1="85" x2="394" y2="515"/>
      <line x1="411" y1="85" x2="411" y2="515"/>
      <line x1="424" y1="85" x2="424" y2="515"/>
      <line x1="435" y1="85" x2="435" y2="515"/>
      <line x1="444" y1="85" x2="444" y2="515"/>
      <line x1="452" y1="85" x2="452" y2="515"/>
      <line x1="459" y1="85" x2="459" y2="515"/>
      <line x1="506" y1="85" x2="506" y2="515"/>
      <line x1="529" y1="85" x2="529" y2="515"/>
      <line x1="546" y1="85" x2="546" y2="515"/>
      <line x1="559" y1="85" x2="559" y2="515"/>
      <line x1="570" y1="85" x2="570" y2="515"/>
      <line x1="579" y1="85" x2="579" y2="515"/>
      <line x1="587" y1="85" x2="587" y2="515"/>
      <line x1="594" y1="85" x2="594" y2="515"/>
    </g>
    <!-- heavy decade boundary lines -->
    <g stroke="#385f8d" stroke-width="3">
      <line x1="195" y1="85" x2="195" y2="515"/>
      <line x1="330" y1="85" x2="330" y2="515"/>
      <line x1="465" y1="85" x2="465" y2="515"/>
      <line x1="600" y1="85" x2="600" y2="515"/>
    </g>
    <!-- plotted doubling: a straight line on semi-log paper -->
    <g>
      <line x1="220" y1="470" x2="560" y2="150" stroke="#F26B5B" stroke-width="3"/>
      <circle cx="220" cy="470" r="6" fill="#F26B5B"/>
      <circle cx="305" cy="390" r="6" fill="#F26B5B"/>
      <circle cx="390" cy="310" r="6" fill="#F26B5B"/>
      <circle cx="475" cy="230" r="6" fill="#F26B5B"/>
      <circle cx="560" cy="150" r="6" fill="#F26B5B"/>
      <text x="480" y="130" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#17324D">1, 2, 4, 8, 16</text>
    </g>
    <!-- handwritten note -->
    <text x="205" y="510" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#17324D">One decade = ×10</text>
  </g>
  <!-- teal pencil -->
  <g transform="rotate(35 640 420)">
    <rect x="628" y="330" width="24" height="150" rx="10" fill="#218C82"/>
    <path d="M628 480 L640 520 L652 480 Z" fill="#17324D"/>
    <rect x="628" y="330" width="24" height="26" rx="10" fill="#F4C95D"/>
  </g>
</svg>
