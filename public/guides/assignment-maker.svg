<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Assignment maker</title>
  <desc id="desc">A tidy assignment sheet with a title, subject line, and numbered questions, beside a coral pencil</desc>
  <rect width="800" height="600" fill="#FFFDF7"/>
  <circle cx="690" cy="90" r="120" fill="#EAF8F5"/>
  <circle cx="110" cy="510" r="90" fill="#FFF0ED"/>
  <!-- confetti dots -->
  <g fill="#F26B5B">
    <circle cx="150" cy="110" r="7"/>
    <circle cx="660" cy="500" r="7"/>
    <circle cx="620" cy="130" r="5"/>
  </g>
  <g fill="#218C82">
    <circle cx="120" cy="180" r="5"/>
    <circle cx="680" cy="440" r="6"/>
    <circle cx="180" cy="470" r="6"/>
  </g>
  <g fill="#F4C95D">
    <circle cx="640" cy="200" r="6"/>
    <circle cx="150" cy="400" r="5"/>
  </g>
  <!-- assignment sheet -->
  <g transform="rotate(-1 400 300)">
    <rect x="215" y="60" width="370" height="480" rx="8" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="2"/>
    <text x="400" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#64748B">Riverside High School</text>
    <text x="400" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#17324D">The Water Cycle</text>
    <text x="400" y="184" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#334155">Science · Grade 6</text>
    <line x1="255" y1="205" x2="545" y2="205" stroke="#E2E8F0" stroke-width="2"/>
    <text x="255" y="240" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#17324D">Instructions</text>
    <text x="255" y="266" font-family="Georgia, serif" font-size="15" fill="#334155">Explain evaporation, condensation,</text>
    <text x="255" y="288" font-family="Georgia, serif" font-size="15" fill="#334155">and precipitation with examples.</text>
    <text x="255" y="330" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#17324D">Main ideas</text>
    <text x="255" y="362" font-family="Georgia, serif" font-size="15" fill="#218C82">1.</text>
    <text x="278" y="362" font-family="Georgia, serif" font-size="15" fill="#334155">Evaporation changes liquid</text>
    <text x="278" y="384" font-family="Georgia, serif" font-size="15" fill="#334155">water into vapor.</text>
    <text x="255" y="416" font-family="Georgia, serif" font-size="15" fill="#218C82">2.</text>
    <text x="278" y="416" font-family="Georgia, serif" font-size="15" fill="#334155">Condensation forms clouds.</text>
    <text x="255" y="448" font-family="Georgia, serif" font-size="15" fill="#218C82">3.</text>
    <text x="278" y="448" font-family="Georgia, serif" font-size="15" fill="#334155">Precipitation returns water</text>
    <text x="278" y="470" font-family="Georgia, serif" font-size="15" fill="#334155">to Earth.</text>
    <text x="400" y="516" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#94A3B8">Page 1</text>
  </g>
  <!-- coral pencil -->
  <g transform="rotate(35 640 420)">
    <rect x="628" y="330" width="24" height="150" rx="10" fill="#F26B5B"/>
    <path d="M628 480 L640 520 L652 480 Z" fill="#17324D"/>
    <rect x="628" y="330" width="24" height="26" rx="10" fill="#F4C95D"/>
  </g>
</svg>
