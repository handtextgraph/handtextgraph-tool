<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Text to handwriting</title>
  <desc id="desc">A lined paper page with handwritten-style lines and a coral pen</desc>
  <rect width="800" height="600" fill="#FFFDF7"/>
  <circle cx="690" cy="90" r="120" fill="#EAF8F5"/>
  <circle cx="110" cy="510" r="90" fill="#FFF0ED"/>
  <!-- paper sheet -->
  <g transform="rotate(-3 400 300)">
    <rect x="180" y="70" width="440" height="470" rx="10" fill="#FFFFFF" stroke="#D9D5CC" stroke-width="2"/>
    <!-- ruled lines -->
    <g stroke="#AFCFC8" stroke-width="2" opacity="0.7">
      <line x1="215" y1="150" x2="585" y2="150"/>
      <line x1="215" y1="210" x2="585" y2="210"/>
      <line x1="215" y1="270" x2="585" y2="270"/>
      <line x1="215" y1="330" x2="585" y2="330"/>
      <line x1="215" y1="390" x2="585" y2="390"/>
      <line x1="215" y1="450" x2="585" y2="450"/>
    </g>
    <!-- red margin line -->
    <line x1="245" y1="70" x2="245" y2="540" stroke="#F26B5B" stroke-width="2.5" opacity="0.55"/>
    <!-- handwritten-style lines -->
    <g fill="none" stroke="#17324D" stroke-width="4" stroke-linecap="round">
      <path d="M265 138 q 12 -14 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0"/>
      <path d="M265 198 q 12 -14 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0"/>
      <path d="M265 258 q 12 -14 24 0 t 24 0 t 24 0 t 24 0 t 24 0"/>
      <path d="M265 318 q 12 -14 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0"/>
      <path d="M265 378 q 12 -14 24 0 t 24 0 t 24 0 t 24 0"/>
    </g>
    <!-- headline in coral script -->
    <path d="M265 108 q 18 -20 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0" fill="none" stroke="#F26B5B" stroke-width="5" stroke-linecap="round"/>
    <!-- small teal underline flourish -->
    <path d="M265 480 q 60 12 160 0" fill="none" stroke="#218C82" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- coral pen -->
  <g transform="rotate(35 640 420)">
    <rect x="628" y="330" width="24" height="150" rx="10" fill="#F26B5B"/>
    <path d="M628 480 L640 520 L652 480 Z" fill="#17324D"/>
    <rect x="628" y="330" width="24" height="26" rx="10" fill="#F4C95D"/>
  </g>
</svg>
