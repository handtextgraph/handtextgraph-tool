<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Handwritten study notes</title>
  <desc id="desc">A sheet of lined paper with handwritten revision notes, a short heading, bullet points and a recap question, with a coral pen</desc>
  <rect width="800" height="600" fill="#FFFDF7"/>
  <circle cx="690" cy="90" r="120" fill="#EAF8F5"/>
  <circle cx="110" cy="510" r="90" fill="#FFF0ED"/>
  <!-- paper sheet -->
  <g transform="rotate(-1 400 300)">
    <rect x="170" y="60" width="460" height="480" rx="10" fill="#FFFFFF" stroke="#D9D5CC" stroke-width="2"/>
    <!-- ruled lines -->
    <g stroke="#8fb3da" stroke-width="2">
      <line x1="195" y1="105" x2="605" y2="105"/>
      <line x1="195" y1="140" x2="605" y2="140"/>
      <line x1="195" y1="175" x2="605" y2="175"/>
      <line x1="195" y1="210" x2="605" y2="210"/>
      <line x1="195" y1="245" x2="605" y2="245"/>
      <line x1="195" y1="280" x2="605" y2="280"/>
      <line x1="195" y1="315" x2="605" y2="315"/>
      <line x1="195" y1="350" x2="605" y2="350"/>
      <line x1="195" y1="385" x2="605" y2="385"/>
      <line x1="195" y1="420" x2="605" y2="420"/>
      <line x1="195" y1="455" x2="605" y2="455"/>
      <line x1="195" y1="490" x2="605" y2="490"/>
    </g>
    <!-- red margin line -->
    <line x1="255" y1="85" x2="255" y2="515" stroke="#dc6b73" stroke-width="3"/>
    <!-- handwritten notes -->
    <g font-family="Georgia, serif" font-style="italic" fill="#17324D">
      <text x="275" y="100" font-size="24" font-weight="bold">The Water Cycle</text>
      <text x="275" y="133" font-size="21">Evaporation — sun heats water</text>
      <text x="275" y="168" font-size="21">Condensation — vapour cools,</text>
      <text x="275" y="203" font-size="21">clouds form from droplets</text>
      <text x="275" y="238" font-size="21">Precipitation — rain, snow,</text>
      <text x="275" y="273" font-size="21">or hail falls to the ground</text>
      <text x="275" y="308" font-size="21">Collection — rivers, lakes,</text>
      <text x="275" y="343" font-size="21">and groundwater gather it</text>
      <text x="275" y="385" font-size="21" fill="#F26B5B">Recap: where does</text>
      <text x="275" y="420" font-size="21" fill="#F26B5B">condensation happen?</text>
    </g>
    <!-- tick marks -->
    <g stroke="#2E7D6B" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M278 458 l6 6 l12 -12"/>
    </g>
  </g>
  <!-- coral pen -->
  <g transform="rotate(35 640 420)">
    <rect x="628" y="330" width="24" height="150" rx="10" fill="#F26B5B"/>
    <path d="M628 480 L640 520 L652 480 Z" fill="#17324D"/>
    <rect x="628" y="330" width="24" height="26" rx="10" fill="#F4C95D"/>
  </g>
</svg>
