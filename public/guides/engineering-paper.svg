    <!-- hand-written beam deflection calculation, one digit per square -->
    <g font-family="Georgia, serif" font-style="italic" fill="#17324D">
      <text x="200" y="130" font-size="24">Cantilever beam</text>
      <text x="200" y="170" font-size="22">I = bh&#179; / 12 = 1.07 &#215; 10&#8315;&#8311; m&#8308;</text>
      <text x="200" y="210" font-size="22">EI = 21,333 N&#183;m&#178;</text>
      <text x="200" y="250" font-size="22">&#948; = PL&#179; / 3EI</text>
      <text x="200" y="290" font-size="22">= 864 / 64,000</text>
      <text x="200" y="330" font-size="26" fill="#F26B5B">&#948; = 13.5 mm</text>
    </g>
    <!-- cantilever sketch: fixed wall, beam, load arrow -->
    <g stroke="#218C82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="200" y1="380" x2="200" y2="460"/>
      <line x1="190" y1="390" x2="210" y2="380"/>
      <line x1="190" y1="410" x2="210" y2="400"/>
      <line x1="190" y1="430" x2="210" y2="420"/>
      <line x1="190" y1="450" x2="210" y2="440"/>
      <line x1="200" y1="400" x2="420" y2="400"/>
      <line x1="200" y1="420" x2="420" y2="420"/>
      <line x1="420" y1="400" x2="420" y2="420"/>
      <line x1="400" y1="360" x2="400" y2="395"/>
      <path d="M400 395 L392 385 M400 395 L408 385"/>
    </g>
    <text x="408" y="372" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#17324D">P = 500 N</text>
    <!-- handwritten note -->
    <text x="205" y="510" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#17324D">One digit per square, one step per bold block</text>
