<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Handwriting practice paper</title>
  <desc id="desc">A practice paper sheet with three-line rows, a dashed midline, and handwritten letters</desc>
  <rect width="800" height="600" fill="#FFFDF7"/>
  <circle cx="690" cy="90" r="120" fill="#EAF8F5"/>
  <circle cx="110" cy="510" r="90" fill="#FFF0ED"/>
  <!-- paper sheet -->
  <g transform="rotate(-1 400 300)">
    <rect x="170" y="60" width="460" height="480" rx="10" fill="#FFFFFF" stroke="#D9D5CC" stroke-width="2"/>
    <!-- practice title -->
    <text x="400" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#17324D">Handwriting Practice</text>
    <!-- row 1: top guide, dashed midline, baseline -->
    <line x1="220" y1="150" x2="580" y2="150" stroke="#8fb3da" stroke-width="2"/>
    <line x1="220" y1="178" x2="580" y2="178" stroke="#a8bfdc" stroke-width="2" stroke-dasharray="8 6"/>
    <line x1="220" y1="206" x2="580" y2="206" stroke="#6f9bd0" stroke-width="3"/>
    <!-- row 2 -->
    <line x1="220" y1="250" x2="580" y2="250" stroke="#8fb3da" stroke-width="2"/>
    <line x1="220" y1="278" x2="580" y2="278" stroke="#a8bfdc" stroke-width="2" stroke-dasharray="8 6"/>
    <line x1="220" y1="306" x2="580" y2="306" stroke="#6f9bd0" stroke-width="3"/>
    <!-- row 3 -->
    <line x1="220" y1="350" x2="580" y2="350" stroke="#8fb3da" stroke-width="2"/>
    <line x1="220" y1="378" x2="580" y2="378" stroke="#a8bfdc" stroke-width="2" stroke-dasharray="8 6"/>
    <line x1="220" y1="406" x2="580" y2="406" stroke="#6f9bd0" stroke-width="3"/>
    <!-- row 4 -->
    <line x1="220" y1="450" x2="580" y2="450" stroke="#8fb3da" stroke-width="2"/>
    <line x1="220" y1="478" x2="580" y2="478" stroke="#a8bfdc" stroke-width="2" stroke-dasharray="8 6"/>
    <line x1="220" y1="506" x2="580" y2="506" stroke="#6f9bd0" stroke-width="3"/>
    <!-- handwritten letters sitting on the baselines -->
    <g font-family="Georgia, serif" font-style="italic" fill="#17324D">
      <text x="240" y="202" font-size="44">Aa</text>
      <text x="320" y="202" font-size="44">Bb</text>
      <text x="400" y="202" font-size="44" fill="#218C82">Gg</text>
      <text x="480" y="202" font-size="44">Hh</text>
      <text x="240" y="302" font-size="44">cat</text>
      <text x="360" y="302" font-size="44" fill="#218C82">dog</text>
      <text x="480" y="302" font-size="44">sun</text>
      <text x="240" y="402" font-size="44">Mum</text>
      <text x="380" y="402" font-size="44" fill="#218C82">Dad</text>
    </g>
    <!-- footer -->
    <text x="400" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#334155">Primary 18 mm  •  three-line rows  •  dashed midline</text>
  </g>
  <!-- coral pencil -->
  <g transform="rotate(35 640 420)">
    <rect x="628" y="330" width="24" height="150" rx="10" fill="#F26B5B"/>
    <path d="M628 480 L640 520 L652 480 Z" fill="#17324D"/>
    <rect x="628" y="330" width="24" height="26" rx="10" fill="#F4C95D"/>
  </g>
</svg>
